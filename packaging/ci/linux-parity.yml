name: Linux parity and native packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: Run opt-in live provider tests (external availability required)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ubuntu-2404:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
      NEDOTIFY_VERSION: 2.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native desktop, audio, tool and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv ffmpeg dbus-x11 xvfb x11-utils xdotool pulseaudio desktop-file-utils gnome-keyring libnotify-bin libegl1 libgl1 libnss3 libnspr4 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libdbus-1-3 libsecret-1-0 libpulse0 libfontconfig1 libfreetype6 fonts-dejavu-core
      - name: Install Linux runtime and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt -r requirements-dev.txt
          .venv/bin/python -m pip check
          .venv/bin/python packaging/linux_support.py --check-tools
      - name: Shell syntax and desktop entry
        run: |
          bash -n start_linux.sh install_linux.sh build_linux.sh
          desktop-file-validate packaging/org.nedotify.NeDotify.desktop
      - name: Deterministic backend, frontend and platform tests
        run: |
          dbus-run-session -- xvfb-run -a .venv/bin/python -m pytest -m 'not network' --junitxml=reports/pytest-linux.xml
      - name: Native source UI smoke and screenshots for both styles
        run: |
          pulseaudio --start --exit-idle-time=-1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' .venv/bin/python tools/validate_linux.py --output reports/native-source
      - name: Build native onedir, portable archive and Debian package
        run: bash build_linux.sh
      - name: Native frozen UI smoke and screenshots for both styles
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' .venv/bin/python tools/validate_linux.py --executable dist/NeDotify/NeDotify --output reports/native-package
      - name: Live provider scenarios (separate from deterministic tests)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.network }}
        run: |
          dbus-run-session -- xvfb-run -a .venv/bin/python -m pytest -m network --junitxml=reports/pytest-network.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-checks-and-screenshots
          path: reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: nedotify-ubuntu-2404-amd64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/NeDotify/BUILD-REQUIREMENTS.txt
